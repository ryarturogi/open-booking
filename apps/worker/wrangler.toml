name = "open-booking-worker"
main = "./src/index.ts"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "open_booking_db"
database_name = "open-booking-db"
database_id = "e643b921-b1fb-43c2-ac83-b45bdb25159c"

[[kv_namespaces]]
binding = "OPEN_BOOKING_KV"
id = "4d0eed9a30894a84a06e208d9c44f9e5"

[triggers]
crons = ["0 3 * * 7", "30 3 * * 7"]

[vars]
# Secret compartido para disparar el job OSM manualmente (POST /__cron/osm?secret=).
# Solo testing; el cron semanal no necesita esta variable.
OSM_JOB_SECRET = "dev-only"